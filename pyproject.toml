[project]
name = "pdf-table-extractor"
version = "0.3.0"
description = "Extract table data from PDFs using AI vision models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "table-extractor-agent",
    "pdf-table-extractor-api",
]

[tool.uv.workspace]
members = ["packages/agent", "packages/api"]

[tool.uv.sources]
table-extractor-agent = { workspace = true }
pdf-table-extractor-api = { workspace = true }
