[project]
name = "pdf-xlsx-converter"
version = "0.1.0"
description = "Convert PDF tables to XLSX spreadsheets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "httpx>=0.27",
]
