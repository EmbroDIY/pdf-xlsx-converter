[project]
name = "pdf-table-extractor-api"
version = "0.1.0"
description = "FastAPI backend for PDF table extraction"
requires-python = ">=3.13"
dependencies = [
    "table-extractor-agent",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.0",
    "supabase>=2.0",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["app", "auth"]
